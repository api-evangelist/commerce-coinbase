  /private/get_risk_profile:
    get:
      description: 'Retrieves risk profile permissions and constraints assigned to the authenticated user account.


        Includes flags for Portfolio Margining eligibility, short option trading authorization, and maximum risk-profile leverage ceiling.


        Try in API console'
      parameters: []
      requestBody:
