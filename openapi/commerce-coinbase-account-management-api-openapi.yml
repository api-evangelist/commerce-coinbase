          og:title: private/get_pme_params
          title: private/get_pme_params
      summary: Get private get pme params
      x-summary-source: derived
      operationId: getPrivateGetPmeParams
      x-operation-id-source: derived
  /private/get_position:
    get:
      description: 'Retrieves the open position for a specific instrument. Returns detailed position information including size, average entry price, mark price, unrealized P&L, initial margin, maintenance margin, and other position-related metrics.


        If no position exists for the specified instrument, the response will indicate a zero position.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      - name: include_isolated
        in: query
        description: If true, retrieves the position from a bound isolated margin subaccount for the instrument. Omit to read the main account cross position. Default - `false`
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 404
                  jsonrpc: '2.0'
                  method: private/get_position
                  params:
                    instrument_name: BTC-PERPETUAL
      responses:
        '200':
          $ref: '#/components/responses/PrivateGetPositionResponse'
        '400':
          $ref: '#/components/responses/ErrorMessageResponse'
      security:
      - ApiKey:
        - view
      - OAuth2:
        - wallet:accounts:read
      tags:
      - Account Management
      x-mint:
