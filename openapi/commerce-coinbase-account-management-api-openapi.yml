          - floating_profit_loss_usd
          - leverage
          - realized_funding
          - interest_value
          - estimated_liquidation_price
          - open_orders_margin
          og:title: private/get_position
          title: private/get_position
      summary: Get private get position
      x-summary-source: derived
      operationId: getPrivateGetPosition
      x-operation-id-source: derived
  /private/get_positions:
    get:
      description: 'Retrieves all open positions for the authenticated account. Returns position details including size, average entry price, mark price, unrealized P&L, initial margin, maintenance margin, and other position-related information.


        Results can be filtered by currency and instrument kind (future, option, etc.). To retrieve positions for a specific subaccount, use the `subaccount_id` parameter.


        Try in API console'
      parameters:
      - name: currency
        in: query
        required: false
        schema:
          example: BTC
          $ref: '#/components/schemas/currency_with_any'
      - name: kind
        in: query
        description: Kind filter on positions
        required: false
        schema:
          example: future
          $ref: '#/components/schemas/kind_without_spot'
      - name: subaccount_id
        in: query
        description: The user id for the subaccount
        required: false
        schema:
          type: integer
      - name: include_isolated
        in: query
        description: If true, widens the positions query to include positions owned by hidden isolated-margin subaccounts. Default - `false`
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 2236
                  jsonrpc: '2.0'
                  method: private/get_positions
                  params:
                    currency: BTC
                    kind: future
      responses:
