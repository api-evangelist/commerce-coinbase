  /private/get_account_summary:
    get:
      description: 'Retrieves the account summary for a specific currency. The summary includes cash `balance`, `equity`, `margin_balance`, `available_funds`, `available_withdrawal_funds`, initial/maintenance margin, session and total PnL, options greeks, and related fields.


        Key relationships (standard margin): `equity = balance + futures session PnL + options_value`, `margin_balance = equity - options_value`, `available_funds = max(0, margin_balance - initial_margin)`. Under portfolio margin, `margin_balance` equals `equity`. Session PnL fields reset at daily settlement; `total_pl` does not.


        To retrieve the summary for a specific subaccount, use the `subaccount_id` parameter. When the `extended` parameter is set to `true`, additional account details such as account ID, username, email, and account type are included.


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol
        required: true
        schema:
          $ref: '#/components/schemas/wallet_currency'
      - name: subaccount_id
        in: query
        description: The user id for the subaccount
        required: false
        schema:
          type: integer
      - name: extended
        in: query
        description: Include additional fields
        required: false
        schema:
          type: boolean
          example: true
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 2515
                  jsonrpc: '2.0'
                  method: private/get_account_summary
                  params:
                    currency: BTC
                    extended: true
      responses:
        '200':
          $ref: '#/components/responses/PrivateAccountResponse'
      security:
