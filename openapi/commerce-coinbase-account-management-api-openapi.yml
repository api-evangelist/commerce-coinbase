  /private/get_leverage:
    get:
      description: 'Retrieves the current user-configured custom leverage and effective maximum leverage for a specified active future instrument.


        When `instrument_name` is supplied, returns a single leverage details object. When omitted, returns leverage details only for futures with a stored custom leverage override; instruments using the default maximum leverage are omitted. For `isolated=true`, regular subaccounts receive an empty object or array because isolated leverage configuration is visible only to the main account.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: false
        schema:
          $ref: '#/components/schemas/instrument_name'
      - name: subaccount_id
        in: query
        description: The user id for the subaccount. Available to retail-broker callers; defaults to the authenticated account.
        required: false
        schema:
          type: integer
      - name: isolated
        in: query
        description: If true, returns leverage settings for isolated margin mode (main accounts only).
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 1
                  jsonrpc: '2.0'
                  method: private/get_leverage
                  params:
                    instrument_name: BTC-PERPETUAL
      responses:
        '200':
          $ref: '#/components/responses/PrivateGetLeverageResponse'
      security:
      - ApiKey:
        - view
      - OAuth2:
        - wallet:accounts:read
      tags:
      - Account Management
      x-mint:
        href: /api-reference/account-management/private-get_leverage
        metadata:
          keywords:
          - private/get_leverage
          - instrument_name
          - subaccount_id
          - isolated
          og:title: private/get_leverage
          title: private/get_leverage
      summary: Get private get leverage
      x-summary-source: derived
      operationId: getPrivateGetLeverage
      x-operation-id-source: derived
  /private/get_pme_params:
    get:
      description: 'Retrieves Portfolio Margin (PM) open-order restrictions and risk limits for the specified currency.


        When Portfolio Margin is enabled, the response includes maximum order counts, aggregate futures and options order sizes, and the risk-reducing order limit. When Portfolio Margin is disabled, the response contains only `enabled: false`.


        **📖 Related Article:** Portfolio Margin


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol
        required: true
        schema:
          $ref: '#/components/schemas/currency'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 1
                  jsonrpc: '2.0'
                  method: private/get_pme_params
                  params:
                    currency: BTC
      responses:
        '200':
          $ref: '#/components/responses/PrivatePmeParamsResponse'
      security:
      - ApiKey:
        - view
      - OAuth2:
        - wallet:accounts:read
      tags:
      - Account Management
      x-mint:
        href: /api-reference/account-management/private-get_pme_params
        metadata:
          keywords:
          - private/get_pme_params
