    delta_total_map:
      description: 'Map of position delta sums by price index (e.g. `btc_usd`), covering both futures and options positions.

        These are raw position deltas: they are not price-adjusted for linear instruments and the options mark value is not subtracted.

        They therefore do not add up to `delta_total`, which is calculated on the Net Transaction Delta basis described under `delta_total`.

        '
      type: object
      additionalProperties:
        type: number
    commission:
      description: Commission paid so far (in base currency)
      type: number
    amount:
      description: It represents the requested order size. For perpetual and inverse futures the amount is in USD units. For options and linear futures it is the underlying base currency coin.
      type: number
    upl:
      description: Unrealized profit and loss on open positions in the current trading session (since the last daily settlement).
      type: number
      example: 0.846863
    user_id:
      description: Unique user identifier
      type: integer
      example: 57874
    web:
      description: '`true` if created via Deribit frontend (optional)'
      type: boolean
    projected_delta_total:
      description: 'The sum of position deltas excluding positions that expire at the nearest expiration, so it shows the delta that will remain once those positions have expired.

        Calculated on the same Net Transaction Delta basis as `delta_total`, including delta decay during the settlement period.

        '
      type: number
      example: 0.1334
    cancel_reason:
      description: 'Enumerated reason behind cancel `"user_request"`, `"autoliquidation"`, `"cancel_on_disconnect"`, `"risk_mitigation"`, `"pme_risk_reduction"` (portfolio margining risk reduction), `"pme_account_locked"` (portfolio margining account locked per currency), `"position_locked"`, `"mmp_trigger"` (market maker protection), `"mmp_config_curtailment"` (market maker configured quantity decreased), `"edit_post_only_reject"` (cancelled on edit because of `reject_post_only` setting), `"oco_other_closed"` (the oco order linked to this order was closed), `"oto_primary_closed"` (the oto primary order that was going to trigger this order was cancelled), `"settlement"` (closed because of a settlement event, e.g. good-til-day orders are cancelled when an instrument enters the daily settlement). Note: orders cancelled because an instrument expired (delivery) currently do not include a `cancel_reason` field.'
      type: string
      enum:
      - user_request
      - autoliquidation
      - cancel_on_disconnect
      - risk_mitigation
      - pme_risk_reduction
      - pme_account_locked
      - position_locked
      - mmp_trigger
      - mmp_config_curtailment
      - edit_post_only_reject
      - oco_other_closed
      - oto_primary_closed
      - settlement
    usd:
