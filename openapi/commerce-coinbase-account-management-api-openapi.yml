    position:
      type: object
      properties:
        average_price:
          description: Average price of trades that built this position
          type: number
        average_price_usd:
          description: Only for options, average price in USD
          type: number
        delta:
          description: Delta parameter
          type: number
        direction:
          $ref: '#/components/schemas/position_direction'
        floating_profit_loss:
          description: Floating profit or loss
          type: number
        floating_profit_loss_usd:
          description: Only for options, floating profit or loss in USD
          type: number
        gamma:
          description: Only for options, Gamma parameter
          type: number
        index_price:
          description: Current index price
          type: number
        initial_margin:
          description: Initial margin
          type: number
        instrument_name:
          $ref: '#/components/schemas/instrument_name'
        interest_value:
          description: Value used to calculate `realized_funding` (perpetual only)
          type: number
        isolated:
          description: Flag indicating whether the position is held by an isolated margin subaccount. Present and true on isolated positions only.
          type: boolean
        kind:
          $ref: '#/components/schemas/kind'
        leverage:
          description: Current available leverage for future position
          type: integer
        main_uid:
          description: User identifier for the owning main account. Present on isolated positions only.
          type: integer
        maintenance_margin:
          description: Maintenance margin
          type: number
        mark_price:
          description: Current mark price for position's instrument
          type: number
        realized_funding:
          description: Realized Funding in current session included in session realized profit or loss, only for positions of perpetual instruments
          type: number
        realized_profit_loss:
          description: Realized profit or loss
          type: number
        settlement_price:
          description: Optional (not added for spot). Last settlement price for position's instrument 0 if instrument wasn't settled yet
          type: number
        size:
          description: Position size for futures size in quote currency (e.g. USD), for options size is in base currency (e.g. BTC)
          type: number
        size_currency:
          description: Only for futures, position size in base currency
          type: number
        theta:
          description: Only for options, Theta parameter
          type: number
        total_profit_loss:
          description: Profit or loss from position
          type: number
        user_id:
          $ref: '#/components/schemas/user_id'
        vega:
          description: Only for options, Vega parameter
          type: number
      required:
      - instrument_name
      - kind
      - user_id
      - average_price
      - direction
      - mark_price
      - delta
      - index_price
      - initial_margin
      - maintenance_margin
      - settlement_price
      - total_profit_loss
      - floating_profit_loss
      - realized_profit_loss
      - size
    implv:
      description: Implied volatility in percent. (Only if `advanced="implv"`)
      type: number
    currency_with_any:
      description: Currency name or `"any"` if don't care
      type: string
      enum:
      - BTC
      - ETH
      - USDC
      - USDT
      - EURR
      - any
    label:
      description: User defined label (up to 64 characters)
      type: string
    instrument_name:
      description: Unique instrument identifier
      type: string
      example: BTC-PERPETUAL
    PrivateGetTransactionLogResponse:
      type: object
      properties:
        id:
          description: The id that was sent in the request
          type: integer
        jsonrpc:
          description: The JSON-RPC version (2.0)
          type: string
          enum:
          - '2.0'
        result:
          type: object
          properties:
            continuation:
              $ref: '#/components/schemas/continuation_with_null'
            logs:
              type: array
              items:
                $ref: '#/components/schemas/transaction_log'
          required:
          - continuation
          - logs
      required:
      - result
      - jsonrpc
    starbase_last_update_timestamp:
      description: The Starbase causal timestamp (nanoseconds since the Unix epoch) of the last book update that affected this order. Present only for orders placed in Starbase, including combo leg order updates; not always available for direct access orders
      type: integer
      example: 1536569522277000000
    close_out_margin:
      description: 'Close-out margin threshold in the selected currency, equal to 50% of the positional maintenance margin.

        Because it sits below `maintenance_margin`, it marks a later and more severe stage than ordinary liquidation: when `margin_balance` falls to or below this level, close-out liquidation takes over.

        On a cross account with an outstanding loan it is not exactly half of the reported `maintenance_margin`: the loan''s maintenance margin is included in `maintenance_margin` but excluded from the close-out threshold.

        Returned only when close-out margin is enabled on the platform.

        '
      type: number
      example: 0
    PrivateGetUserLocksResponse:
      type: object
      properties:
        id:
          description: The id that was sent in the request
          type: integer
        jsonrpc:
          description: The JSON-RPC version (2.0)
          type: string
          enum:
          - '2.0'
        result:
          type: array
          items:
            properties:
              currency:
                $ref: '#/components/schemas/currency'
              enabled:
                description: Value is set to 'true' when user account is locked in currency
                type: boolean
              message:
                description: Optional information for user why his account is locked
                type: string
            required:
            - currency
            - enabled
            type: object
      required:
      - result
      - jsonrpc
    mobile:
      description: Optional field with value `true` added only when created with Mobile Application
      type: boolean
    trade_id:
      description: Unique (per currency) trade identifier
      type: string
    refresh_amount:
      description: The initial display amount of iceberg order. Iceberg order display amount will be refreshed to that value after match consuming actual display amount. Absent for other types of orders
      type: number
    additional_reserve:
      description: The account's balance reserved for open buy option orders and option combo orders (the premium payable if they fill). Only non-zero on the `cross_sm` margin model; balance reserved by spot orders is reported separately in `spot_reserve`.
      type: number
      example: 0.3
    access_log:
      type: object
      properties:
        city:
          description: City where the IP address is registered (estimated)
          type: string
        country:
          description: Country where the IP address is registered (estimated)
          type: string
        data:
          description: Optional, additional information about action, type depends on `log` value
          oneOf:
          - type: object
          - type: string
        id:
          $ref: '#/components/schemas/id'
        ip:
          description: IP address of source that generated action
          type: string
        log:
          description: 'Action description. Possible values:


            - ``changed_email`` - email was changed

            - ``changed_password`` - password was changed

            - ``disabled_tfa`` - TFA was disabled

            - ``enabled_tfa`` - TFA was enabled

            - ``success`` - successful login

            - ``failure`` - login failure

            - ``enabled_subaccount_login`` - login was enabled for subaccount (in `data` - subaccount uid)

            - ``disabled_subaccount_login`` - login was disabled for subaccount (in `data` - subaccount uid)

            - ``new_api_key`` - API key was created (in `data` key client id)

            - ``removed_api_key`` - API key was removed (in `data` key client id)

            - ``changed_scope`` - scope of API key was changed (in `data` key client id)

            - ``changed_whitelist`` - whitelist of API key was edited (in `data` key client id)

            - ``disabled_api_key`` - API key was disabled (in `data` key client id)

            - ``enabled_api_key`` - API key was enabled (in `data` key client id)

            - ``reset_api_key`` - API key was reset (in `data` key client id)

            '
          type: string
        timestamp:
          $ref: '#/components/schemas/timestamp'
      required:
      - id
      - ip
      - timestamp
      - country
      - city
      - log
    filled_amount:
      description: Filled amount of the order. For perpetual and futures the filled_amount is in USD units, for options - in units or corresponding cryptocurrency contracts, e.g., BTC or ETH.
      type: number
    original_order_type:
      description: Original API order type when an order is represented internally as a limit order. For example, Starbase market orders use `"limit"` as `order_type` with `"market"` in this optional field.
      type: string
      enum:
      - market
      - market_limit
