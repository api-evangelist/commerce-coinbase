      description: 'Close-out margin calculated as if instruments expiring at the nearest expiration were excluded, i.e. 50% of the projected positional maintenance margin.

        As with `close_out_margin`, the loan maintenance margin counted in `projected_maintenance_margin` is excluded here, so on a cross account with an outstanding loan the two are not exactly proportional.

        Returned only when close-out margin is enabled on the platform.

