components:
  schemas:
    PrivatePmeParamsResponse:
      type: object
      properties:
        id:
          description: The id that was sent in the request
          type: integer
        jsonrpc:
          description: The JSON-RPC version (2.0)
          type: string
          enum:
          - '2.0'
        result:
          description: 'Portfolio Margin order restrictions, or `enabled: false` when Portfolio Margin is disabled.'
          type: object
          oneOf:
          - additionalProperties: false
            properties:
              enabled:
                description: Portfolio Margin is enabled for the account.
                type: boolean
                enum:
                - true
              max_future_open_orders:
                description: Maximum number of open futures orders.
                type: integer
              max_future_open_orders_size:
                description: Maximum aggregate size of open futures orders.
                type: number
              max_option_open_orders:
                description: Maximum number of open option orders.
                type: integer
              max_option_open_orders_size:
                description: Maximum aggregate size of open option orders, in contracts.
                type: number
              max_risk_reducing_orders:
                description: Maximum number of risk-reducing orders.
                type: integer
              max_total_open_orders:
                description: Maximum total number of open derivatives orders.
                type: integer
            required:
            - enabled
            - max_total_open_orders
            - max_future_open_orders
            - max_option_open_orders
            - max_future_open_orders_size
            - max_option_open_orders_size
            - max_risk_reducing_orders
            type: object
          - additionalProperties: false
            properties:
              enabled:
                description: Portfolio Margin is disabled for the account.
                type: boolean
                enum:
                - false
            required:
            - enabled
            type: object
      required:
      - jsonrpc
      - result
    ErrorMessageResponse:
      type: object
      properties:
        error:
          type: integer
        id:
          description: The id that was sent in the request
          type: integer
        jsonrpc:
          description: The JSON-RPC version (2.0)
          type: string
          enum:
          - '2.0'
        message:
          type: string
      required:
      - message
      - error
      - jsonrpc
    fee_balance:
      description: The account's fee balance (it can be used to pay for fees)
      type: number
    PrivatePmeSimulateResponse:
      type: object
      properties:
        id:
          description: The id that was sent in the request
          type: integer
        jsonrpc:
          description: The JSON-RPC version (2.0)
          type: string
          enum:
          - '2.0'
        result:
          description: Simulation details
          type: object
      required:
      - result
      - jsonrpc
    PrivateAccountSummariesResponse:
      type: object
      properties:
        id:
          description: The id that was sent in the request
          type: integer
        jsonrpc:
          description: The JSON-RPC version (2.0)
          type: string
          enum:
          - '2.0'
        result:
          type: object
          properties:
            affiliate_promotion_fee:
              description: Affiliate promotion fee (if greater than 0.0)
              type: number
              example: 0
            block_rfq_self_match_prevention:
              description: When enabled, Block RFQ self-match prevention stops RFQ execution between accounts under the same legal entity. Independent of general self-match prevention (available when parameter `extended` = `true`).
              type: boolean
              example: false
            creation_timestamp:
              description: Time at which the account was created (milliseconds since the Unix epoch; available when parameter `extended` = `true`)
              type: integer
              example: 1542100802842
            email:
              description: User email (available when parameter `extended` = `true`)
              type: string
              example: support@deribit.com
            id:
              description: Account id (available when parameter `extended` = `true`)
              type: integer
              example: 12354
            interuser_transfers_enabled:
              description: '`true` when the inter-user transfers are enabled for user (available when parameter `extended` = `true`)'
              type: boolean
              example: false
            isolated_account_summaries:
              description: List of account summaries for active isolated-margin subaccounts, present only when `include_isolated=true`. Each entry includes the subaccount ID (`id`) and a nested `summaries` array containing per-currency account balances and risk metrics.
              type: array
              items:
                type: object
            login_enabled:
              description: Whether account is loginable using email and password (available when parameter `extended` = `true` and account is a subaccount)
              type: boolean
              example: false
            mmp_enabled:
              description: Whether MMP is enabled (available when parameter `extended` = `true`)
              type: boolean
              example: false
            receive_notifications:
              description: Whether the account receives notifications
              type: boolean
              example: false
            referrer_id:
              description: Optional identifier of the referrer (of the affiliation program, and available when parameter `extended` = `true`), which link was used by this account at registration. It coincides with suffix of the affiliation link path after `/reg-`
              type: string
              example: '517.6035'
            security_keys_enabled:
              description: Whether Security Key authentication is enabled (available when parameter `extended` = `true`)
              type: boolean
              example: false
            self_trading_extended_to_subaccounts:
              description: '`true` if self trading rejection behavior is applied to trades between subaccounts (available when parameter `extended` = `true`)'
              type: string
            self_trading_reject_mode:
              description: Self trading rejection behavior - `reject_taker` or `cancel_maker` (available when parameter `extended` = `true`)
              type: string
            summaries:
              description: Aggregated list of per-currency account summaries
              type: array
              items:
                properties:
                  additional_reserve:
                    $ref: '#/components/schemas/additional_reserve'
                  affiliate_promotion_fee:
                    description: Affiliate promotion fee (if greater than 0.0)
                    type: number
                    example: 0
                  available_funds:
                    description: Funds available to increase margin usage (open or enlarge positions). Equal to `margin_balance - initial_margin`, floored at `0` in the API response. When initial margin usage exceeds 100%, this is `0` and only reducing orders can be placed. When cross collateral is enabled, this aggregated value is calculated by converting the sum of each cross collateral currency's value to the given currency, using each cross collateral currency's index.
                    type: number
                    example: 2.2638913
                  available_withdrawal_funds:
                    description: Funds available to withdraw in the selected currency. Typically lower than `available_funds` because withdrawals also exclude positive session profit, locked balance, `spot_reserve`, `additional_reserve`, and non-withdrawable external/implied equity components. Always ≥ `0`.
                    type: number
                    example: 2.26
                  balance:
                    description: The account's cash balance in the selected currency (deposits, withdrawals, transfers, option premiums, settlements/deliveries, corrections, costs, and insurance refills). Does not include open futures PnL or options mark value.
                    type: number
                    example: 3.4906363
                  close_out_margin:
                    $ref: '#/components/schemas/close_out_margin'
                  cross_collateral_enabled:
                    description: When `true` cross collateral is enabled for user
                    type: boolean
                    example: true
                  currency:
                    description: Currency of the summary
                    type: string
                    example: ETH
                  delta_total:
                    $ref: '#/components/schemas/delta_total'
                  delta_total_map:
                    $ref: '#/components/schemas/delta_total_map'
                  deposit_address:
                    description: The deposit address for the account (if available)
                    type: string
                    example: 14diAAyXL5UzhPTCKC998ch2GV7DMb7yDi
                  equity:
                    description: 'The account''s equity in the selected currency: `balance + futures (session UPL + RPL) + options mark value` (plus any external/implied equity). Related: `margin_balance` excludes options mark value under standard margin.'
                    type: number
                    example: 2.6437733
                  fee_balance:
                    $ref: '#/components/schemas/fee_balance'
                  fee_group:
                    description: 'Fee group indicates the level of fee discounts applied to an account. Use `extended`: `true` to view this field. If the field is missing, the account is not assigned to any fee group. **📖 Related Support Article:** [Automatically applied volume based fee discounts](https://support.deribit.com/hc/en-us/articles/25944746248989-Fees#heading-11)'
                    type: string
                  fees:
                    description: Fee structure for all currency pairs and instrument types related to the currency (available when parameter `extended` = `true` and user has any discounts). Keys are index names (e.g., "btc_usd"), values are objects with instrument types as keys (option, perpetual, future).
                    type: object
                    additionalProperties:
                      additionalProperties:
                        properties:
                          block_trade:
                            description: Block trade fee (if applicable)
                            type: number
                          default:
                            type: object
                            properties:
                              maker:
                                description: Maker fee
                                type: number
                              taker:
                                description: Taker fee
                                type: number
                              type:
                                description: Fee calculation type (e.g., fixed, relative)
                                type: string
                            required:
                            - type
                            - taker
                            - maker
                        required:
                        - default
                        type: object
                      type: object
                  futures_pl:
                    description: Combined profit and loss of all futures and perpetual positions included in `total_pl` (`total_pl - options_pl`).
                    type: number
                    example: 0
                  futures_session_rpl:
                    description: Session realized profit and loss for futures and perpetual positions (resets at daily settlement).
                    type: number
                    example: 0
                  futures_session_upl:
                    description: Session unrealized profit and loss for open futures and perpetual positions.
                    type: number
                    example: 0
                  has_non_block_chain_equity:
