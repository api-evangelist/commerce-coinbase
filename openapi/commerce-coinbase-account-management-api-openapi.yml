  /private/get_transaction_log:
    get:
      description: 'Retrieves a detailed transaction log for the authenticated account. The log includes all account activities such as trades, deposits, withdrawals, transfers, fees, and other balance-affecting operations.


        Results can be filtered by currency, time range, and transaction type. Use the `continuation` parameter for pagination when retrieving large transaction histories. To retrieve transactions for a specific subaccount, use the `subaccount_id` parameter.


        Trade entries executed in Starbase include `starbase_match_id`, `starbase_order_id`, and `starbase_timestamp`.


        When an option expires out of the money, the transaction log type is `expiry`. As there is nothing to settle into futures in this case, this remains the only entry in the transaction log for that expiration.


        **History Limit:** This API method has **no time limit** - users can query transaction history back to account creation. Note that the CSV export feature available on the website is year-limited to 2023.


        **Note - This method has distinct API rate limiting requirements:** Sustained rate: 1 request/second. For more information, see Rate Limits.


        **📖 Related Support Article:** Transaction log


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol
        required: true
        schema:
          $ref: '#/components/schemas/wallet_currency'
      - name: start_timestamp
        in: query
        description: The earliest timestamp to return result from (milliseconds since the UNIX epoch)
        required: true
        schema:
          $ref: '#/components/schemas/timestamp'
      - name: end_timestamp
        in: query
        description: The most recent timestamp to return result from (milliseconds since the UNIX epoch)
        required: true
        schema:
          $ref: '#/components/schemas/timestamp'
      - name: query
        in: query
        description: 'The following keywords can be used to filter the results: `trade`, `maker`, `taker`, `open`, `close`, `liquidation`, `buy`, `sell`, `withdrawal`, `delivery`, `settlement`, `deposit`, `transfer`, `option`, `future`, `correction`, `block_trade`, `swap`, `expiry`. Plus withdrawal or transfer addresses'
        required: false
        schema:
          type: string
          example: settlement
      - name: count
        in: query
        description: Count of transaction log entries returned, default - `100`, maximum - `250`
        required: false
        schema:
          type: integer
          maximum: 250
          minimum: 1
      - name: subaccount_id
        in: query
        description: Id of a subaccount
        required: false
        schema:
          type: integer
          example: 9
      - name: continuation
        in: query
        description: Continuation token for pagination
        required: false
        schema:
          type: integer
          example: 429946
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 4
                  jsonrpc: '2.0'
                  method: private/get_transaction_log
                  params:
                    count: 5
                    currency: BTC
                    end_timestamp: '1613660407000'
                    start_timestamp: '1613657734000'
      responses:
        '200':
          $ref: '#/components/responses/PrivateGetTransactionLogResponse'
      security:
      - ApiKey:
        - view
      - OAuth2:
        - wallet:transactions:read
