        in: query
        description: The user id for the subaccount. Available to retail-broker callers; defaults to the authenticated account.
        required: false
        schema:
          type: integer
      - name: isolated
        in: query
        description: If true, evaluates maximum order size under isolated margin scope.
        required: false
        schema:
          type: boolean
          default: false
      - name: leverage
        in: query
        description: Custom hypothetical leverage to evaluate order size limits against. Must be between 1 and the account's effective maximum leverage.
        required: false
        schema:
          type: number
          minimum: 1
      - name: taker_fee_rate
        in: query
        description: Hypothetical non-negative taker fee rate override. Explicit overrides require fee-rate override authorization.
        required: false
        schema:
          type: number
          minimum: 0
      - name: price
        in: query
        description: Positive hypothetical order price. Uses current book and mark prices if omitted.
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
