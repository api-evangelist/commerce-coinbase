  /private/get_settlement_history_by_currency:
    get:
      description: 'Retrieves settlement, delivery, and bankruptcy events that have affected your account for a specific currency.


        **Settlement vs. delivery:** Settlement is a daily event (at 08:00 UTC) for futures and perpetual positions that converts unrealized profit and loss into realized profit and loss. Option positions do not settle. Delivery is a one-time event that occurs when a futures or options contract expires — any remaining open position is closed at the delivery price. Delivery does not apply to perpetual or spot instruments. Both events take place at 08:00 UTC, which is why they are sometimes conflated.


        Results can be filtered by settlement type and timestamp. Use pagination parameters (`count` and `continuation`) to retrieve large settlement histories. This data is useful for tracking account-affecting settlement events and understanding how contract expirations impact your account.


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol
        required: true
        schema:
          $ref: '#/components/schemas/currency'
      - name: type
        in: query
        description: Settlement type
        required: false
        schema:
          $ref: '#/components/schemas/settlement_type'
      - name: count
        in: query
        description: Number of requested items, default - `20`, maximum - `1000`
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
      - name: continuation
        in: query
        description: Continuation token for pagination
        required: false
        schema:
          type: string
          example: xY7T6cutS3t2B9YtaDkE6TS379oKnkzTvmEDUnEUP2Msa9xKWNNaT
      - name: search_start_timestamp
        in: query
        description: The latest timestamp to return result from (milliseconds since the UNIX epoch)
        required: false
        schema:
          $ref: '#/components/schemas/timestamp'
      - name: subaccount_id
        in: query
        description: The user id for the subaccount. Isolated perpetual settlements are recorded per subaccount and only visible when targeting the subaccount directly.
        required: false
        schema:
          type: integer
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 8304
                  jsonrpc: '2.0'
                  method: private/get_settlement_history_by_currency
                  params:
                    count: 1
                    currency: BTC
                    type: delivery
      responses:
        '200':
          $ref: '#/components/responses/PrivateSettlementResponse'
      security:
      - ApiKey:
        - view
      - OAuth2:
        - wallet:transactions:read
      tags:
      - Trading
      x-mint:
        href: /api-reference/trading/private-get_settlement_history_by_currency
        metadata:
          keywords:
          - private/get_settlement_history_by_currency
          - currency
          - type
          - count
          - continuation
          - search_start_timestamp
          - settlements
          - funding
          - funded
          - index_price
          - instrument_name
          - mark_price
          - position
          - profit_loss
          - session_bankruptcy
          - session_profit_loss
          - session_tax
          - session_tax_rate
          - socialized
          - timestamp
          og:title: private/get_settlement_history_by_currency
          title: private/get_settlement_history_by_currency
      summary: Get private get settlement history by currency
      x-summary-source: derived
      operationId: getPrivateGetSettlementHistoryByCurrency
      x-operation-id-source: derived
