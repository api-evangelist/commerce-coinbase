  /private/set_leverage:
    get:
      description: 'Sets a custom leverage multiplier for a specified future instrument.


        Custom leverage cannot exceed the effective `max_leverage` allowed by the account''s risk profile. Passing `null` as the leverage value removes the custom leverage setting and restores the default leverage.


        Custom leverage setting is disabled for isolated subaccounts. Setting leverage in isolated margin mode is restricted to main accounts.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      - name: leverage
        in: query
        description: Target custom leverage multiplier. Must be between 1 and max_leverage. Pass null to remove custom leverage and restore risk-profile default.
        required: true
        schema:
          type:
          - number
          - 'null'
      - name: subaccount_id
        in: query
        description: The user id for the subaccount. Available to retail-broker callers; defaults to the authenticated account.
        required: false
        schema:
          type: integer
      - name: isolated
        in: query
        description: If true, sets leverage for isolated margin scope (main account only).
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 1
                  jsonrpc: '2.0'
                  method: private/set_leverage
                  params:
                    instrument_name: BTC-PERPETUAL
                    leverage: 50
      responses:
        '200':
          $ref: '#/components/responses/PrivateSetLeverageResponse'
      security:
      - ApiKey:
        - trade
      - OAuth2:
        - wallet:accounts:update
      tags:
      - Trading
      x-mint:
        href: /api-reference/trading/private-set_leverage
        metadata:
          keywords:
          - private/set_leverage
          - instrument_name
          - leverage
          - subaccount_id
          - isolated
          og:title: private/set_leverage
          title: private/set_leverage
      summary: Get private set leverage
      x-summary-source: derived
      operationId: getPrivateSetLeverage
      x-operation-id-source: derived
