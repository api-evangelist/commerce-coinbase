  /private/get_user_trades_by_currency:
    get:
      description: 'Retrieves the latest user trades that have occurred for instruments in a specific currency. Returns trade details including price, amount, direction, timestamp, trade ID, and order ID for all instruments in the currency.


        Results can be filtered by instrument kind, trade ID range, or timestamp range. Use the `count` parameter to limit the number of trades returned, and `sorting` to control the order. To retrieve trades for a specific subaccount, use the `subaccount_id` parameter. Use `historical` to retrieve historical trade data.


        **📖 Related Article:** Accessing Historical Trades and Orders Using API


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol
        required: true
        schema:
          $ref: '#/components/schemas/currency'
      - name: kind
        in: query
        description: Instrument kind, `"combo"` for any combo or `"any"` for all. If not provided instruments of all kinds are considered
        required: false
        schema:
          $ref: '#/components/schemas/kind_with_combo_all'
      - name: start_id
        in: query
        description: 'The ID of the first trade to be returned. Number for BTC trades, or hyphen name in ex. `"ETH-15"` # `"ETH_USDC-16"`'
        required: false
        schema:
          $ref: '#/components/schemas/trade_id'
      - name: end_id
        in: query
        description: 'The ID of the last trade to be returned. Number for BTC trades, or hyphen name in ex. `"ETH-15"` # `"ETH_USDC-16"`'
        required: false
        schema:
          $ref: '#/components/schemas/trade_id'
      - name: count
        in: query
        description: Number of requested items, default - `10`, maximum - `1000`
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
      - name: start_timestamp
        in: query
        description: The earliest timestamp to return result from (milliseconds since the UNIX epoch). When param is provided trades are returned from the earliest
        required: false
        schema:
          $ref: '#/components/schemas/timestamp'
      - name: end_timestamp
        in: query
        description: 'The most recent timestamp to return result from (milliseconds since the UNIX epoch). Only one of params: start_timestamp, end_timestamp is truly required'
        required: false
        schema:
          $ref: '#/components/schemas/timestamp'
      - name: sorting
        in: query
        description: Direction of results sorting (`default` value means no sorting, results will be returned in order in which they left the database)
        required: false
