  /private/get_max_order_size:
    get:
      description: 'Calculates maximum tradable order sizes (buy, sell, and reduce-only) for a future instrument based on current account available funds, position, and open orders.


        Supports hypothetical parameters (`leverage`, `price`, `taker_fee_rate`) to simulate order size capacity under target trading conditions. Requires Standard Margin model.


        Try in API console'
      parameters:
