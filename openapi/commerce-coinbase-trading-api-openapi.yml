  /private/cancel:
    get:
      description: 'Cancels a specific order identified by its order ID. The order must be open (not yet filled or cancelled) to be cancelled successfully.


        Once cancelled, the order is removed from the order book and cannot be restored. Any unfilled portion of the order will be cancelled.


        Try in API console'
      parameters:
      - name: order_id
        in: query
        description: The order id
        required: true
        schema:
          $ref: '#/components/schemas/order_id'
      - name: isolated
        in: query
        description: If true, routes the order cancellation to the isolated margin subaccount that owns the order. Omitting this flag searches only the main account and returns `order_not_found` or `not_owner_of_order` for isolated orders. Default - `false`
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 4214
                  jsonrpc: '2.0'
                  method: private/cancel
                  params:
                    order_id: ETH-SLIS-12
      responses:
        '200':
          $ref: '#/components/responses/PrivateCancelResponse'
      security:
      - ApiKey:
        - trade
      - OAuth2:
        - wallet:buys:create
      tags:
      - Trading
      x-mint:
        href: /api-reference/trading/private-cancel
        metadata:
