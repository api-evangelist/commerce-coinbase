components:
  schemas:
    block_trade_leg_count:
      description: Block trade leg count - when trade was part of a block trade
      type: integer
      example: 3
    instrument:
      type: object
      properties:
        base_currency:
          description: The underlying currency being traded.
          type: string
          enum:
          - BTC
          - ETH
        base_currency_uuid:
          description: Internal identifier for the base currency. Absent if the base currency does not have an assigned identifier.
          type: string
          example: 5b71fc48-3dd3-540c-809b-f8c94d0e68b5
        block_trade_commission:
          description: Block Trade commission for instrument.
          type: number
          example: 0.0005
        block_trade_min_trade_amount:
          description: Minimum amount for block trading.
          type: number
          example: 25
        block_trade_tick_size:
          description: Specifies minimal price change for block trading.
          type: number
          example: 0.01
        contract_size:
          description: Contract size for the instrument, expressed in the same unit as the order amount. For inverse (reversed) futures and perpetuals this is USD — BTC-PERPETUAL has a contract size of 10 USD. For options, spots, and for linear futures and perpetuals it is the base currency coin — BTC_USDC-PERPETUAL has a contract size of 0.0001 BTC. Note that on an inverse instrument `base_currency` identifies the underlying and settlement coin and does not indicate the unit of `contract_size`.
          type: number
          example: 1
        counter_currency:
          description: Counter currency for the instrument.
          type: string
          enum:
          - USD
          - USDC
        creation_timestamp:
          description: The time when the instrument was first created (milliseconds since the UNIX epoch).
          type: integer
          example: 1536569522277
        expiration_timestamp:
          description: The time when the instrument will expire (milliseconds since the UNIX epoch).
          type: integer
        future_type:
          description: Future type (only for futures)(field is deprecated and will be removed in the future, `instrument_type` should be used instead).
          type: string
          enum:
          - linear
          - reversed
        index_id:
          description: Numeric identifier of the price index used by this instrument. Derived from the index currency pair, so all instruments sharing the same `price_index` also share the same `index_id`.
          type: integer
          example: 1000004
        instrument_id:
          $ref: '#/components/schemas/instrument_id'
        instrument_name:
          $ref: '#/components/schemas/instrument_name'
        instrument_type:
          description: Type of the instrument. `linear` or `reversed`
          type: string
        is_active:
          description: Indicates if the instrument can currently be traded.
          type: boolean
        is_cbe_routed:
          description: Optional (only for spot routed to Coinbase Exchange). Alias of `is_csr` added by `public/get_instrument` and `public/get_instruments`; other surfaces that return instrument metadata, such as the `instrument.creation.{kind}.{currency}` notification, carry `is_csr` only. When present it is always `true` and is omitted for every other instrument, so test for its presence rather than for a `false` value.
          type: boolean
        is_csr:
          description: Optional (only for spot routed to Coinbase Exchange). When present it is always `true`, meaning orders on this instrument are routed to Coinbase Exchange (CBE) for matching instead of the native Deribit matching engine. The field is omitted for every other instrument, so test for its presence rather than for a `false` value.
          type: boolean
        kind:
          $ref: '#/components/schemas/kind'
        lot_size:
          description: Lot size for instrument, used as the unit for fee lot counting.
          type: number
          example: 1
        maker_commission:
          description: Maker commission for instrument.
          type: number
          example: 0.0001
        max_leverage:
          description: Maximal leverage for instrument (only for futures).
          type: integer
          example: 100
        max_liquidation_commission:
          description: Maximal liquidation trade commission for instrument (only for futures).
          type: number
          example: 0.001
        min_trade_amount:
          description: Minimum amount for trading. For perpetual and inverse futures the amount is in USD units. For options and linear futures it is the underlying base currency coin.
          type: number
          example: 0.1
        option_type:
          description: The option type (only for options).
          type: string
          enum:
          - call
          - put
        price_index:
          $ref: '#/components/schemas/price_index'
        product_group:
          description: Product group classification of the instrument's base currency. Determines gateway and multicast channel assignment — see [Underlying Tiers](https://docs.deribit.com/starbase/underlying-tiers).
          type: string
          example: BTC
          enum:
          - BTC
          - ETH
          - TIER_2
          - TIER_3
        qty_tick_size:
          description: Minimum quantity change (step size) for order amounts on this instrument.
          type: number
          example: 1
        quote_currency:
          description: The currency in which the instrument prices are quoted.
          type: string
          enum:
          - USD
        quote_currency_uuid:
          description: Internal identifier for the quote currency. Absent if the quote currency does not have an assigned identifier.
          type: string
          example: 2b92315d-eab7-5bef-84fa-089a131333f5
        settlement_currency:
          description: Optional (not added for spot). Settlement currency for the instrument.
          type: string
          enum:
          - BTC
          - ETH
        settlement_period:
          description: Optional (not added for spot). The settlement period.
          type: string
          enum:
          - month
          - week
          - perpetual
        state:
          $ref: '#/components/schemas/book_state'
        strike:
          description: The strike value (only for options).
          type: number
        taker_commission:
          description: Taker commission for instrument.
          type: number
          example: 0.0005
        tick_size:
          description: Specifies minimal price change and, as follows, the number of decimal places for instrument prices.
          type: number
          example: 0.0001
        tick_size_steps:
          $ref: '#/components/schemas/tick_size_step'
        underlying_type:
          description: The type of the underlying asset.
          type: string
          enum:
          - crypto
          - equity
          - commodity
          - preipo
          - equity_etf
          - crypto_index
          - adr
          - foreign_equity
          - equity_index
          - commodity_index
          - commodity_etf
          - otc
      required:
      - kind
      - base_currency
      - quote_currency
      - min_trade_amount
      - instrument_name
      - is_active
      - settlement_period
      - creation_timestamp
      - tick_size
      - expiration_timestamp
      - contract_size
      - price_index
      - index_id
      - product_group
      - underlying_type
    PublicGetFundingRateHistoryResponse:
      type: object
      properties:
