openapi: 3.2.0
info:
  description: Coinbase Retail Advanced Trade API for derivatives trading.
  title: Coinbase Retail Advanced Trade (Deribit) Market Data API
  version: 2.1.1
servers:
- url: https://drb.coinbase.com/api/v2
tags:
- name: Market Data
paths:
  /public/get_book_summary_by_currency:
    get:
      description: 'Retrieves summary information such as open interest, 24-hour volume, best bid/ask prices, last trade price, and other market statistics for all instruments in a given currency.


        Results can be filtered by instrument kind (future, option, etc.). This method provides a quick overview of market activity across all instruments for a currency.


        **Note:** For real-time updates, we recommend using the WebSocket subscription to `ticker.{instrument_name}.{interval}` instead of polling this endpoint.


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol
        required: true
        schema:
          $ref: '#/components/schemas/currency'
      - name: kind
        in: query
        description: Instrument kind, if not provided instruments of all kinds are considered
        required: false
        schema:
          $ref: '#/components/schemas/kind'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 9344
                  jsonrpc: '2.0'
                  method: public/get_book_summary_by_currency
                  params:
                    currency: BTC
                    kind: future
      responses:
        '200':
          $ref: '#/components/responses/PublicGetBookSummaryResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_book_summary_by_currency
        metadata:
          keywords:
          - public/get_book_summary_by_currency
          - currency
          - kind
          - instrument_name
          - high
          - low
          - base_currency
          - quote_currency
          - volume
          - bid_price
          - ask_price
          - mid_price
          - mark_price
          - last
          - open_interest
          - creation_timestamp
          - estimated_delivery_price
          - volume_usd
          - volume_notional
          - current_funding
          - funding_8h
          - mark_iv
          - interest_rate
          - underlying_index
          - underlying_price
          - price_change
          og:title: public/get_book_summary_by_currency
          title: public/get_book_summary_by_currency
      summary: Get public get book summary by currency
      x-summary-source: derived
      operationId: getPublicGetBookSummaryByCurrency
      x-operation-id-source: derived
  /public/get_book_summary_by_instrument:
    get:
      description: 'Retrieves summary information such as open interest, 24-hour volume, best bid/ask prices, last trade price, mark price, and other market statistics for a specific instrument.


        This method provides a quick overview of current market activity and liquidity for a single instrument.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 3659
                  jsonrpc: '2.0'
                  method: public/get_book_summary_by_instrument
                  params:
                    instrument_name: ETH-22FEB19-140-P
      responses:
        '200':
          $ref: '#/components/responses/PublicGetBookSummaryResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_book_summary_by_instrument
        metadata:
          keywords:
          - public/get_book_summary_by_instrument
          - instrument_name
          - high
          - low
          - base_currency
          - quote_currency
          - volume
          - bid_price
          - ask_price
          - mid_price
          - mark_price
          - last
          - open_interest
          - creation_timestamp
          - estimated_delivery_price
          - volume_usd
          - volume_notional
          - current_funding
          - funding_8h
          - mark_iv
          - interest_rate
          - underlying_index
          - underlying_price
          - price_change
          og:title: public/get_book_summary_by_instrument
          title: public/get_book_summary_by_instrument
      summary: Get public get book summary by instrument
      x-summary-source: derived
      operationId: getPublicGetBookSummaryByInstrument
      x-operation-id-source: derived
  /public/get_contract_size:
    get:
      description: 'Retrieves the contract size (also known as contract multiplier) for a given instrument. The contract size is the value of one contract, expressed in the same unit as the order amount: USD for inverse (reversed) futures and perpetuals, and the base currency coin for options, spots, and linear futures and perpetuals.


        This value is essential for calculating position values, margin requirements, and P&L calculations. Different instruments may have different contract sizes.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      responses:
        '200':
          $ref: '#/components/responses/PublicGetContractSizeResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_contract_size
        metadata:
          keywords:
          - public/get_contract_size
          - instrument_name
          - contract_size
          og:title: public/get_contract_size
          title: public/get_contract_size
      summary: Get public get contract size
      x-summary-source: derived
      operationId: getPublicGetContractSize
      x-operation-id-source: derived
  /public/get_currencies:
    get:
      description: 'Retrieves all cryptocurrencies supported by the Deribit API. Returns a list of available currencies with their codes and basic information.


        This method takes no parameters and is useful for discovering which currencies are available for trading on the platform.


        Try in API console'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 7538
                  jsonrpc: '2.0'
                  method: public/get_currencies
                  params: {}
      responses:
        '200':
          $ref: '#/components/responses/PublicGetCurrenciesResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_currencies
        metadata:
          keywords:
          - public/get_currencies
          - withdrawal_fee
          - withdrawal_priorities
          - min_withdrawal_fee
          - currency
          - currency_long
          - min_confirmations
          - coin_type
          - in_cross_collateral_pool
          - apr
          - network_fee
          - network_currency
          - decimals
          - currency_uuid
          - name
          - value
          og:title: public/get_currencies
          title: public/get_currencies
      summary: Get public get currencies
      x-summary-source: derived
      operationId: getPublicGetCurrencies
      x-operation-id-source: derived
  /public/get_delivery_prices:
    get:
      description: 'Retrieves historical delivery prices for a given index. Delivery prices are the settlement prices used when futures or options contracts expire and are settled.


        Results can be paginated using the `offset` and `count` parameters. This method is useful for analyzing historical settlement prices and understanding how contracts have been settled over time.


        Try in API console'
      parameters:
      - name: index_name
        in: query
        description: Index identifier, matches (base) cryptocurrency with quote currency
        required: true
        schema:
          $ref: '#/components/schemas/index_name'
      - name: offset
        in: query
        description: The offset for pagination, default - `0`
        required: false
        schema:
          type: integer
          example: 10
      - name: count
        in: query
        description: Number of requested items, default - `10`, maximum - `1000`
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 3601
                  jsonrpc: '2.0'
                  method: public/get_delivery_prices
                  params:
                    count: 5
                    index_name: btc_usd
                    offset: 0
      responses:
        '200':
          $ref: '#/components/responses/PublicGetDeliveryPricesResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_delivery_prices
        metadata:
          keywords:
          - public/get_delivery_prices
          - index_name
          - offset
          - count
          - records_total
          - data
          - date
          - delivery_price
          og:title: public/get_delivery_prices
          title: public/get_delivery_prices
      summary: Get public get delivery prices
      x-summary-source: derived
      operationId: getPublicGetDeliveryPrices
      x-operation-id-source: derived
  /public/get_expirations:
    get:
      description: 'Retrieves all available expiration timestamps for instruments. This method can be used to discover which expiration dates are available for trading, which is useful for finding instruments with specific expiration dates.


        Results can be filtered by settlement currency, instrument kind (future or option), and currency pair. The response includes expiration timestamps in milliseconds since the UNIX epoch.


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol or `"any"` for all or '"grouped"' for all grouped by currency
        required: true
        schema:
          $ref: '#/components/schemas/settlement_currency_with_any_and_grouped'
      - name: kind
        in: query
        description: Instrument kind, `"future"` or `"option"` or `"any"`
        required: true
        schema:
          $ref: '#/components/schemas/kind_future_or_option_with_any'
      - name: currency_pair
        in: query
        description: The currency pair symbol
        required: false
        schema:
          $ref: '#/components/schemas/index_name'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 1
                  jsonrpc: '2.0'
                  method: public/get_expirations
                  params:
                    currency: any
                    kind: any
      responses:
        '200':
          $ref: '#/components/responses/PublicGetExpirationsResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_expirations
        metadata:
          keywords:
          - public/get_expirations
          - currency
          - kind
          - currency_pair
          og:title: public/get_expirations
          title: public/get_expirations
      summary: Get public get expirations
      x-summary-source: derived
      operationId: getPublicGetExpirations
      x-operation-id-source: derived
  /public/get_funding_chart_data:
    get:
      description: 'Retrieves funding rate chart data points for a PERPETUAL instrument within a given time period. The data is formatted for use in charting applications and includes funding rate values at regular intervals.


        Use the `length` parameter to specify the time period for which to retrieve chart data. This method is useful for visualizing funding rate trends over time.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      - name: length
        in: query
        description: Specifies time period. `8h` - 8 hours, `24h` - 24 hours, `1m` - 1 month
        required: true
        schema:
          type: string
          enum:
          - 8h
          - 24h
          - 1m
      responses:
        '200':
          $ref: '#/components/responses/PublicGetFundingChartDataResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_funding_chart_data
        metadata:
          keywords:
          - public/get_funding_chart_data
          - instrument_name
          - length
          - current_interest
          - interest_8h
          - data
          - timestamp
          - index_price
          og:title: public/get_funding_chart_data
          title: public/get_funding_chart_data
      summary: Get public get funding chart data
      x-summary-source: derived
      operationId: getPublicGetFundingChartData
      x-operation-id-source: derived
  /public/get_funding_rate_history:
    get:
      description: 'Retrieves hourly historical funding rate (interest rate) data for a PERPETUAL instrument over a specified time period. Funding rates are periodic payments exchanged between long and short positions in perpetual contracts.


        The response includes hourly funding rate values, which can be used to analyze funding rate trends and calculate historical funding costs. This method is applicable only for PERPETUAL instruments.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      - name: start_timestamp
        in: query
        description: The earliest timestamp to return result from (milliseconds since the UNIX epoch)
        required: true
        schema:
          $ref: '#/components/schemas/timestamp'
      - name: end_timestamp
        in: query
        description: The most recent timestamp to return result from (milliseconds since the UNIX epoch)
        required: true
        schema:
          $ref: '#/components/schemas/timestamp'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 7617
                  jsonrpc: '2.0'
                  method: public/get_funding_rate_history
                  params:
                    end_timestamp: 1569902400000
                    instrument_name: BTC-PERPETUAL
                    start_timestamp: 1569888000000
      responses:
        '200':
          $ref: '#/components/responses/PublicGetFundingRateHistoryResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_funding_rate_history
        metadata:
          keywords:
          - public/get_funding_rate_history
          - instrument_name
          - start_timestamp
          - end_timestamp
          - timestamp
          - prev_index_price
          - index_price
          - interest_1h
          - interest_8h
          og:title: public/get_funding_rate_history
          title: public/get_funding_rate_history
      summary: Get public get funding rate history
      x-summary-source: derived
      operationId: getPublicGetFundingRateHistory
      x-operation-id-source: derived
  /public/get_funding_rate_value:
    get:
      description: 'Retrieves the funding rate (interest rate) value for a perpetual instrument over a specified time period. Funding rates are periodic payments exchanged between long and short positions in perpetual contracts.


        This method is applicable only for PERPETUAL instruments. The funding rate is typically expressed as a percentage and is used to keep the perpetual contract price aligned with the underlying index price.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      - name: start_timestamp
        in: query
        description: The earliest timestamp to return result from (milliseconds since the UNIX epoch)
        required: true
        schema:
          $ref: '#/components/schemas/timestamp'
      - name: end_timestamp
        in: query
        description: The most recent timestamp to return result from (milliseconds since the UNIX epoch)
        required: true
        schema:
          $ref: '#/components/schemas/timestamp'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 7617
                  jsonrpc: '2.0'
                  method: public/get_funding_rate_value
                  params:
                    end_timestamp: 1569974400000
                    instrument_name: BTC-PERPETUAL
                    start_timestamp: 1569888000000
      responses:
        '200':
          $ref: '#/components/responses/PublicGetFundingRateValueResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_funding_rate_value
        metadata:
          keywords:
          - public/get_funding_rate_value
          - instrument_name
          - start_timestamp
          - end_timestamp
          og:title: public/get_funding_rate_value
          title: public/get_funding_rate_value
      summary: Get public get funding rate value
      x-summary-source: derived
      operationId: getPublicGetFundingRateValue
      x-operation-id-source: derived
  /public/get_historical_volatility:
    get:
      description: 'Provides historical volatility data for a given cryptocurrency. Historical volatility measures the degree of price variation over a past period and is useful for risk assessment and option pricing.


        The response includes volatility statistics calculated from historical price movements. This data can be used for portfolio risk analysis and understanding market conditions.


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol
        required: true
        schema:
          $ref: '#/components/schemas/currency'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 8387
                  jsonrpc: '2.0'
                  method: public/get_historical_volatility
                  params:
                    currency: BTC
      responses:
        '200':
          $ref: '#/components/responses/PublicGetHistoricalVolatilityResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_historical_volatility
        metadata:
          keywords:
          - public/get_historical_volatility
          - currency
          - timestamp
          - value
          og:title: public/get_historical_volatility
          title: public/get_historical_volatility
      summary: Get public get historical volatility
      x-summary-source: derived
      operationId: getPublicGetHistoricalVolatility
      x-operation-id-source: derived
  /public/get_index_chart_data:
    get:
      description: 'Returns historical price index chart data for the specified index name and time range. The data is formatted for use in charting applications and shows price index values over time.


        Use the `range` parameter to specify the time period for which to retrieve chart data. This method is useful for visualizing price index trends and historical movements.


        Try in API console'
      parameters:
      - name: index_name
        in: query
        description: Index identifier, matches (base) cryptocurrency with quote currency
        required: true
        schema:
          $ref: '#/components/schemas/index_name'
      - name: range
        in: query
        description: Range of the data to return
        required: true
        schema:
          type: string
          enum:
          - 1h
          - 1d
          - 2d
          - 1m
          - 1y
          - all
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 1
                  jsonrpc: '2.0'
                  method: public/get_index_chart_data
                  params:
                    index_name: btc_usd
                    range: 1m
      responses:
        '200':
          $ref: '#/components/responses/PublicGetIndexChartDataResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_index_chart_data
        metadata:
          keywords:
          - public/get_index_chart_data
          - index_name
          - range
          og:title: public/get_index_chart_data
          title: public/get_index_chart_data
      summary: Get public get index chart data
      x-summary-source: derived
      operationId: getPublicGetIndexChartData
      x-operation-id-source: derived
  /public/get_index_price:
    get:
      description: 'Retrieves the current index price value for a given index name. Index prices are used as reference prices for mark price calculations and settlement.


        Use `get_index_price_names` or `get_supported_index_names` to retrieve available index names.


        Try in API console'
      parameters:
      - name: index_name
        in: query
        description: Index identifier, matches (base) cryptocurrency with quote currency
        required: true
        schema:
          $ref: '#/components/schemas/index_name'
      responses:
        '200':
          $ref: '#/components/responses/PublicGetIndexPriceResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_index_price
        metadata:
          keywords:
          - public/get_index_price
          - index_name
          - index_price
          - estimated_delivery_price
          og:title: public/get_index_price
          title: public/get_index_price
      summary: Get public get index price
      x-summary-source: derived
      operationId: getPublicGetIndexPrice
      x-operation-id-source: derived
  /public/get_index_price_names:
    get:
      description: 'Retrieves the identifiers (names) of all supported price indexes. Price indexes are reference prices used for mark price calculations, settlement, and other market operations.


        When the `extended` parameter is set to `true`, the response includes additional information such as whether future combo creation and option combo creation are enabled for each index.


        Try in API console'
      parameters:
      - name: extended
        in: query
        description: When set to `true`, returns additional information including `future_combo_creation_enabled` and `option_combo_creation_enabled` for each index
        required: false
        schema:
          type: boolean
          example: true
          default: false
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 1
                  jsonrpc: '2.0'
                  method: public/get_index_price_names
                  params:
                    extended: true
      responses:
        '200':
          $ref: '#/components/responses/PublicGetIndexPriceNamesResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_index_price_names
        metadata:
          keywords:
          - public/get_index_price_names
          - extended
          - name
          - future_combo_creation_enabled
          - option_combo_creation_enabled
          og:title: public/get_index_price_names
          title: public/get_index_price_names
      summary: Get public get index price names
      x-summary-source: derived
      operationId: getPublicGetIndexPriceNames
      x-operation-id-source: derived
  /public/get_instrument:
    get:
      description: 'Retrieves detailed information about a specific instrument, including instrument specifications, contract details, tick size, settlement currency, expiration date (for futures and options), strike price (for options), underlying type, and other instrument parameters.


        This method is useful for obtaining instrument metadata needed for trading operations and calculations.


        Try in API console'
      parameters:
      - name: instrument_name
        in: query
        description: Instrument name
        required: true
        schema:
          $ref: '#/components/schemas/instrument_name'
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 2
                  jsonrpc: '2.0'
                  method: public/get_instrument
                  params:
                    instrument_name: BTC-13JAN23-16000-P
      responses:
        '200':
          $ref: '#/components/responses/PublicGetInstrumentResponse'
      security: []
      tags:
      - Market Data
      x-mint:
        href: /api-reference/market-data/public-get_instrument
        metadata:
          keywords:
          - public/get_instrument
          - instrument_name
          - kind
          - settlement_currency
          - counter_currency
          - base_currency
          - quote_currency
          - min_trade_amount
          - instrument_id
          - is_active
          - settlement_period
          - creation_timestamp
          - tick_size
          - tick_size_steps
          - expiration_timestamp
          - strike
          - option_type
          - future_type
          - instrument_type
          - contract_size
          - lot_size
          - maker_commission
          - taker_commission
          - max_liquidation_commission
          - block_trade_commission
          - block_trade_tick_size
          - block_trade_min_trade_amount
          - max_leverage
          - price_index
          - underlying_type
          - state
          - base_currency_uuid
          - quote_currency_uuid
          - qty_tick_size
          - index_id
          - product_group
          - is_csr
          - is_cbe_routed
          - above_price
          og:title: public/get_instrument
          title: public/get_instrument
      summary: Get public get instrument
      x-summary-source: derived
      operationId: getPublicGetInstrument
      x-operation-id-source: derived
  /public/get_instruments:
    get:
      description: 'Retrieves available trading instruments. This method can be used to see which instruments are available for trading, or which instruments have recently expired.


        **Note - This method has distinct API rate limiting requirements:** Sustained rate: 1 request/second. To avoid rate limits, we recommend using either the REST requests for server-cached data or the WebSocket subscription to instrument_state.{kind}.{currency} for real-time updates. For more information, see Rate Limits.


        Results can be filtered by currency and instrument kind (future, option, etc.). Set the `expired` parameter to `true` to retrieve recently expired instruments instead of active ones. Each instrument includes the `underlying_type` field indicating the underlying asset class (such as `crypto`, `equity`, or `commodity`).


        Try in API console'
      parameters:
      - name: currency
        in: query
        description: The currency symbol or `"any"` for all
        required: true
        schema:
          $ref: '#/components/schemas/currency_with_any'
      - name: kind
        in: query
        description: Instrument kind, if not provided instruments of all kinds are considered
        required: false
        schema:
          $ref: '#/components/schemas/kind'
      - name: expired
        in: query
        description: Set to true to show recently expired instruments instead of active ones.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: JSON-RPC request body
        content:
          application/json:
            examples:
              request:
                description: JSON-RPC Request Example
                value:
                  id: 1
                  jsonrpc: '2.0'
                  method: public/get_instruments
                  params:
                    currency: BTC
                    kind: future
