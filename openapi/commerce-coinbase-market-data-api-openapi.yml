    PublicGetMarkPriceHistoryResponse:
      type: object
      properties:
        id:
          description: The id that was sent in the request
          type: integer
        jsonrpc:
          description: The JSON-RPC version (2.0)
          type: string
          enum:
          - '2.0'
        result:
          description: Markprice history values as an array of arrays with 2 values each. The inner values correspond to the timestamp in ms and the markprice itself.
          type: array
          items:
            items:
              type: number
            type: array
      required:
      - result
      - jsonrpc
    interest_rate:
      description: Interest rate used in implied volatility calculations (options only)
      type: number
    direction:
      description: 'Direction: `buy`, or `sell`'
      type: string
      enum:
      - buy
      - sell
    book_summary:
      type: object
      properties:
        ask_price:
          description: The current best ask price, `null` if there aren't any asks
          type: number
          example: 7022.89
        base_currency:
          description: Base currency
          type: string
          example: ETH
        bid_price:
          description: The current best bid price, `null` if there aren't any bids
          type: number
          example: 7022.89
        creation_timestamp:
          $ref: '#/components/schemas/timestamp'
        current_funding:
          description: Current instantaneous funding rate (perpetual only). Calculated as `(mark_price − index_price) / index_price` at this moment. This is the rate that would apply if a funding settlement occurred right now.
          type: number
          example: 0.12344
        estimated_delivery_price:
          description: Optional (only for derivatives). Estimated delivery price for the market.
          type: number
          example: 11628.81
        funding_8h:
          description: Projected 8-hour funding rate for the current settlement window (perpetual only). This is the time-weighted accumulation of the funding rate since the last 8-hour settlement — i.e. the total rate that will be charged or received at the next settlement. `current_funding` shows the instantaneous rate; `funding_8h` shows what has accumulated toward the next settlement.
          type: number
        high:
          description: Price of the 24h highest trade
          type: number
          example: 7022.89
        instrument_name:
          $ref: '#/components/schemas/instrument_name'
        interest_rate:
          description: Interest rate used in implied volatility calculations (options only)
          type: number
          example: 0
        last:
          description: The price of the latest trade, `null` if there weren't any trades
          type: number
          example: 7022.89
        low:
          description: Price of the 24h lowest trade, `null` if there weren't any trades
          type: number
          example: 7022.89
        mark_iv:
          $ref: '#/components/schemas/mark_iv'
        mark_price:
          description: The current instrument market price
